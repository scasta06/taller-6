<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1380" width="1320" height="1380" role="img"><title>Diagrama UML del diario de restaurantes</title><desc>Diez clases de la interfaz, sus widgets y relaciones, y dos clases del modelo.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1 1L9 4L1 7" fill="none" stroke="#31586d"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fa"/><g font-family="Arial,sans-serif" fill="#172e40">
<text x="35" y="47" font-size="32" font-weight="700" fill="#172e40">Diario de restaurantes</text>
<text x="35" y="80" font-size="17" font-weight="400" fill="#172e40">Diagrama de clases UML · Los campos tipados identifican las asociaciones. Los componentes locales figuran entre paréntesis.</text>
<text x="35" y="126" font-size="21" font-weight="700" fill="#22526a">Interfaz gráfica · principal</text>
<text x="465" y="126" font-size="21" font-weight="700" fill="#23664b">Lógica de negocio · mundo</text>
<rect x="35" y="146" width="390" height="267" fill="white" stroke="#7793a1"/><rect x="36" y="147" width="388" height="54" fill="#cee3ef"/>
<text x="48" y="169" font-size="20" font-weight="700" fill="#172e40">VentanaPrincipal</text>
<text x="48" y="191" font-size="14" font-weight="400" fill="#172e40">extends JFrame</text>
<text x="48" y="224" font-size="14.5" font-weight="400" fill="#172e40">− mundo : Diario</text>
<text x="48" y="247" font-size="14.5" font-weight="400" fill="#172e40">− pBotones : PanelBotones</text>
<text x="48" y="270" font-size="14.5" font-weight="400" fill="#172e40">− pLista : PanelLista</text>
<text x="48" y="293" font-size="14.5" font-weight="400" fill="#172e40">− pDetalles : PanelDetallesRestaurante</text>
<text x="48" y="316" font-size="14.5" font-weight="400" fill="#172e40">− ventanaMapa : VentanaMapa [0..1]</text>
<text x="48" y="339" font-size="14.5" font-weight="400" fill="#172e40">− ventanaAgregar : VentanaAgregarRestaurante [0..1]</text>
<path d="M35 349h390" stroke="#bac9cf"/>
<text x="48" y="371" font-size="15" font-weight="400" fill="#172e40">+ agregarRestaurante(…)</text>
<text x="48" y="394" font-size="15" font-weight="400" fill="#172e40">+ cambiarRestauranteSeleccionado(Restaurante)</text>
<rect x="465" y="146" width="390" height="152" fill="white" stroke="#7793a1"/><rect x="466" y="147" width="388" height="54" fill="#bce4d3"/>
<text x="478" y="169" font-size="20" font-weight="700" fill="#172e40">Diario</text>
<text x="478" y="191" font-size="14" font-weight="400" fill="#172e40">extends Object</text>
<text x="478" y="224" font-size="14.5" font-weight="400" fill="#172e40">− restaurantes : List&lt;Restaurante&gt;</text>
<path d="M465 234h390" stroke="#bac9cf"/>
<text x="478" y="256" font-size="15" font-weight="400" fill="#172e40">+ agregarRestaurante(Restaurante)</text>
<text x="478" y="279" font-size="15" font-weight="400" fill="#172e40">+ getRestaurantes(boolean) : List&lt;Restaurante&gt;</text>
<rect x="895" y="146" width="390" height="221" fill="white" stroke="#7793a1"/><rect x="896" y="147" width="388" height="54" fill="#bce4d3"/>
<text x="908" y="169" font-size="20" font-weight="700" fill="#172e40">Restaurante</text>
<text x="908" y="191" font-size="14" font-weight="400" fill="#172e40">extends Object</text>
<text x="908" y="224" font-size="14.5" font-weight="400" fill="#172e40">− nombre : String</text>
<text x="908" y="247" font-size="14.5" font-weight="400" fill="#172e40">− calificacion : int</text>
<text x="908" y="270" font-size="14.5" font-weight="400" fill="#172e40">− coordenadaX, coordenadaY : int</text>
<text x="908" y="293" font-size="14.5" font-weight="400" fill="#172e40">+ visitado : boolean</text>
<path d="M895 303h390" stroke="#bac9cf"/>
<text x="908" y="325" font-size="15" font-weight="400" fill="#172e40">+ getNombre(), getCalificacion(), isVisitado()</text>
<text x="908" y="348" font-size="15" font-weight="400" fill="#172e40">+ getX(), getY(), toString()</text>
<path d="M425 224H464" stroke="#31586d" stroke-width="1.5" fill="none" marker-end="url(#flecha)"/>
<path d="M855 224H894" stroke="#31586d" stroke-width="1.5" fill="none" marker-end="url(#flecha)"/>
<text x="436" y="213" font-size="14" font-weight="400" fill="#172e40">1</text>
<text x="856" y="213" font-size="14" font-weight="400" fill="#172e40">0..*</text>
<text x="35" y="460" font-size="21" font-weight="700" fill="#22526a">Interfaz gráfica · paneles de la ventana principal</text>
<rect x="35" y="478" width="390" height="175" fill="white" stroke="#7793a1"/><rect x="36" y="479" width="388" height="54" fill="#cee3ef"/>
<text x="48" y="501" font-size="20" font-weight="700" fill="#172e40">PanelBotones</text>
<text x="48" y="523" font-size="14" font-weight="400" fill="#172e40">extends JPanel · implements ActionListener</text>
<text x="48" y="556" font-size="14.5" font-weight="400" fill="#172e40">− butNuevo, butVerTodos : JButton</text>
<text x="48" y="579" font-size="14.5" font-weight="400" fill="#172e40">− ventanaPrincipal : VentanaPrincipal</text>
<path d="M35 589h390" stroke="#bac9cf"/>
<text x="48" y="611" font-size="15" font-weight="400" fill="#172e40">+ actionPerformed(ActionEvent)</text>
<text x="48" y="634" font-size="15" font-weight="400" fill="#172e40">Solicita abrir el formulario o el mapa.</text>
<rect x="465" y="478" width="390" height="221" fill="white" stroke="#7793a1"/><rect x="466" y="479" width="388" height="54" fill="#cee3ef"/>
<text x="478" y="501" font-size="20" font-weight="700" fill="#172e40">PanelLista</text>
<text x="478" y="523" font-size="14" font-weight="400" fill="#172e40">extends JPanel · implements ListSelectionListener</text>
<text x="478" y="556" font-size="14.5" font-weight="400" fill="#172e40">− listaDeRestaurantes : JList&lt;Restaurante&gt;</text>
<text x="478" y="579" font-size="14.5" font-weight="400" fill="#172e40">− dataModel : DefaultListModel&lt;Restaurante&gt;</text>
<text x="478" y="602" font-size="14.5" font-weight="400" fill="#172e40">− ventanaPrincipal : VentanaPrincipal</text>
<text x="478" y="625" font-size="14.5" font-weight="400" fill="#172e40">(scroll : JScrollPane)</text>
<path d="M465 635h390" stroke="#bac9cf"/>
<text x="478" y="657" font-size="15" font-weight="400" fill="#172e40">+ valueChanged(ListSelectionEvent)</text>
<text x="478" y="680" font-size="15" font-weight="400" fill="#172e40">Envía el seleccionado a VentanaPrincipal.</text>
<rect x="895" y="478" width="390" height="198" fill="white" stroke="#7793a1"/><rect x="896" y="479" width="388" height="54" fill="#cee3ef"/>
<text x="908" y="501" font-size="20" font-weight="700" fill="#172e40">PanelDetallesRestaurante</text>
<text x="908" y="523" font-size="14" font-weight="400" fill="#172e40">extends JPanel</text>
<text x="908" y="556" font-size="14.5" font-weight="400" fill="#172e40">− labNombre, labCalificacion : JLabel</text>
<text x="908" y="579" font-size="14.5" font-weight="400" fill="#172e40">− chkVisitado : JCheckBox</text>
<text x="908" y="602" font-size="14.5" font-weight="400" fill="#172e40">(3 filas JPanel con rótulos JLabel)</text>
<path d="M895 612h390" stroke="#bac9cf"/>
<text x="908" y="634" font-size="15" font-weight="400" fill="#172e40">+ actualizarRestaurante(Restaurante)</text>
<text x="908" y="657" font-size="15" font-weight="400" fill="#172e40">Muestra la calificación con un ImageIcon.</text>
<text x="35" y="733" font-size="21" font-weight="700" fill="#22526a">Interfaz gráfica · agregar restaurante</text>
<rect x="35" y="752" width="390" height="244" fill="white" stroke="#7793a1"/><rect x="36" y="753" width="388" height="54" fill="#cee3ef"/>
<text x="48" y="775" font-size="20" font-weight="700" fill="#172e40">VentanaAgregarRestaurante</text>
<text x="48" y="797" font-size="14" font-weight="400" fill="#172e40">extends JFrame</text>
<text x="48" y="830" font-size="14.5" font-weight="400" fill="#172e40">− panelMapa : PanelMapaAgregar</text>
<text x="48" y="853" font-size="14.5" font-weight="400" fill="#172e40">− panelDetalles : PanelEditarRestaurante</text>
<text x="48" y="876" font-size="14.5" font-weight="400" fill="#172e40">− panelBotones : PanelBotonesAgregar</text>
<text x="48" y="899" font-size="14.5" font-weight="400" fill="#172e40">− ventanaPrincipal : VentanaPrincipal</text>
<text x="48" y="922" font-size="14.5" font-weight="400" fill="#172e40">(inferior : JPanel; aviso : JOptionPane)</text>
<path d="M35 932h390" stroke="#bac9cf"/>
<text x="48" y="954" font-size="15" font-weight="400" fill="#172e40">+ agregarRestaurante(), cerrarVentana()</text>
<text x="48" y="977" font-size="15" font-weight="400" fill="#172e40">Envía los datos a VentanaPrincipal.</text>
<rect x="465" y="752" width="390" height="198" fill="white" stroke="#7793a1"/><rect x="466" y="753" width="388" height="54" fill="#cee3ef"/>
<text x="478" y="775" font-size="20" font-weight="700" fill="#172e40">PanelEditarRestaurante</text>
<text x="478" y="797" font-size="14" font-weight="400" fill="#172e40">extends JPanel</text>
<text x="478" y="830" font-size="14.5" font-weight="400" fill="#172e40">− txtNombre : JTextField</text>
<text x="478" y="853" font-size="14.5" font-weight="400" fill="#172e40">− cbbCalificacion : JComboBox&lt;String&gt;</text>
<text x="478" y="876" font-size="14.5" font-weight="400" fill="#172e40">− cbbVisitado : JComboBox&lt;String&gt;</text>
<text x="478" y="899" font-size="14.5" font-weight="400" fill="#172e40">(3 filas JPanel con rótulos JLabel)</text>
<path d="M465 909h390" stroke="#bac9cf"/>
<text x="478" y="931" font-size="15" font-weight="400" fill="#172e40">+ getNombre(), getCalificacion(), getVisitado()</text>
<rect x="895" y="752" width="390" height="175" fill="white" stroke="#7793a1"/><rect x="896" y="753" width="388" height="54" fill="#cee3ef"/>
<text x="908" y="775" font-size="20" font-weight="700" fill="#172e40">PanelBotonesAgregar</text>
<text x="908" y="797" font-size="14" font-weight="400" fill="#172e40">extends JPanel · implements ActionListener</text>
<text x="908" y="830" font-size="14.5" font-weight="400" fill="#172e40">− butNuevo, butCerrar : JButton</text>
<text x="908" y="853" font-size="14.5" font-weight="400" fill="#172e40">− ventanaPrincipal : VentanaAgregarRestaurante</text>
<path d="M895 863h390" stroke="#bac9cf"/>
<text x="908" y="885" font-size="15" font-weight="400" fill="#172e40">+ actionPerformed(ActionEvent)</text>
<text x="908" y="908" font-size="15" font-weight="400" fill="#172e40">Solicita crear el restaurante o cerrar la ventana.</text>
<rect x="35" y="1055" width="390" height="198" fill="white" stroke="#7793a1"/><rect x="36" y="1056" width="388" height="54" fill="#cee3ef"/>
<text x="48" y="1078" font-size="20" font-weight="700" fill="#172e40">PanelMapaAgregar</text>
<text x="48" y="1100" font-size="14" font-weight="400" fill="#172e40">extends JPanel · implements MouseListener</text>
<text x="48" y="1133" font-size="14.5" font-weight="400" fill="#172e40">− labMapa : JLabel (ImageIcon)</text>
<text x="48" y="1156" font-size="14.5" font-weight="400" fill="#172e40">− x, y : int</text>
<path d="M35 1166h390" stroke="#bac9cf"/>
<text x="48" y="1188" font-size="15" font-weight="400" fill="#172e40">+ mouseClicked(MouseEvent)</text>
<text x="48" y="1211" font-size="15" font-weight="400" fill="#172e40">+ getCoordenadas() : int[]</text>
<text x="48" y="1234" font-size="15" font-weight="400" fill="#172e40">Entrega el punto a VentanaAgregarRestaurante.</text>
<text x="465" y="1035" font-size="21" font-weight="700" fill="#22526a">Interfaz gráfica · mapa de restaurantes</text>
<rect x="465" y="1055" width="390" height="221" fill="white" stroke="#7793a1"/><rect x="466" y="1056" width="388" height="54" fill="#cee3ef"/>
<text x="478" y="1078" font-size="20" font-weight="700" fill="#172e40">VentanaMapa</text>
<text x="478" y="1100" font-size="14" font-weight="400" fill="#172e40">extends JFrame · implements ActionListener</text>
<text x="478" y="1133" font-size="14.5" font-weight="400" fill="#172e40">− panelMapa : PanelMapaVisualizar</text>
<text x="478" y="1156" font-size="14.5" font-weight="400" fill="#172e40">− radioTodos, radioVisitados : JRadioButton</text>
<text x="478" y="1179" font-size="14.5" font-weight="400" fill="#172e40">− ventanaPrincipal : VentanaPrincipal</text>
<text x="478" y="1202" font-size="14.5" font-weight="400" fill="#172e40">(filtros : JPanel; grupo : ButtonGroup)</text>
<path d="M465 1212h390" stroke="#bac9cf"/>
<text x="478" y="1234" font-size="15" font-weight="400" fill="#172e40">+ actionPerformed(ActionEvent), actualizarMapa()</text>
<text x="478" y="1257" font-size="15" font-weight="400" fill="#172e40">Pide a VentanaPrincipal la lista según el filtro.</text>
<rect x="895" y="1055" width="390" height="198" fill="white" stroke="#7793a1"/><rect x="896" y="1056" width="388" height="54" fill="#cee3ef"/>
<text x="908" y="1078" font-size="20" font-weight="700" fill="#172e40">PanelMapaVisualizar</text>
<text x="908" y="1100" font-size="14" font-weight="400" fill="#172e40">extends JPanel</text>
<text x="908" y="1133" font-size="14.5" font-weight="400" fill="#172e40">− labMapa : JLabel (ImageIcon)</text>
<text x="908" y="1156" font-size="14.5" font-weight="400" fill="#172e40">− restaurantes : List&lt;Restaurante&gt;</text>
<path d="M895 1166h390" stroke="#bac9cf"/>
<text x="908" y="1188" font-size="15" font-weight="400" fill="#172e40">+ actualizarMapa(List&lt;Restaurante&gt;)</text>
<text x="908" y="1211" font-size="15" font-weight="400" fill="#172e40">+ paint(Graphics)</text>
<text x="908" y="1234" font-size="15" font-weight="400" fill="#172e40">Dibuja los puntos y nombres con Graphics2D.</text>
